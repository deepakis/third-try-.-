<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Open Flutter — Camera A / Camera B (OBS test)</title>
  <style>
    * { box-sizing: border-box; }
    html, body { margin: 0; height: 100%; background: #fff; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      color: #111; display: flex; flex-direction: column;
    }
    main { flex: 1; display: grid; grid-template-columns: 1fr 1fr; gap: 16px; padding: 16px; min-height: 0; }
    .camera {
      border: 3px solid #111; border-radius: 20px; background: #fff; color: #111;
      font: inherit; font-size: clamp(26px, 5.5vw, 64px); font-weight: 800; letter-spacing: 1px;
      cursor: pointer; display: flex; flex-direction: column; align-items: center; justify-content: center;
      gap: 14px; transition: background .12s, color .12s, transform .06s; padding: 12px; text-align: center;
    }
    .camera small { font-size: clamp(12px, 1.4vw, 17px); font-weight: 500; opacity: .6; max-width: 90%; }
    .camera:active:not([disabled]) { transform: scale(.985); }
    .camera[data-state="active"],
    .camera[data-state="active"]:hover { background: #111; color: #fff; }
    .camera[data-state="active"] small { opacity: .85; }
    /* hover last, but never on the live/active button */
    .camera:hover:not([disabled]):not([data-state="active"]) { background: #f2f2f2; }
    .camera[data-state="busy"] { background: #fff7d6; border-color: #b58a00; color: #6b5200; }
    .camera[data-state="error"] { background: #ffe9e9; border-color: #c02b2b; color: #8c1010; }
    .camera[disabled] { cursor: not-allowed; opacity: .5; }

    footer { border-top: 1px solid #e3e3e3; background: #fafafa; padding: 10px 14px; font-size: 12px; }
    .row { display: flex; gap: 14px; align-items: center; flex-wrap: wrap; }
    .dot { width: 9px; height: 9px; border-radius: 50%; background: #c02b2b; display: inline-block; }
    .dot[data-live="1"] { background: #1e9e4a; }
    .row b { font-weight: 700; }
    label.opt { display: inline-flex; gap: 6px; align-items: center; cursor: pointer; user-select: none; }
    #log {
      margin: 8px 0 0; max-height: 26vh; overflow: auto; white-space: pre-wrap;
      font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 11.5px; line-height: 1.5; color: #333;
    }
  </style>
</head>
<body>
  <main>
    <button class="camera" id="camA" data-cam="A" data-state="idle" disabled>
      Camera A<small id="subA">connecting to OBS…</small>
    </button>
    <button class="camera" id="camB" data-cam="B" data-state="idle" disabled>
      Camera B<small id="subB">connecting to OBS…</small>
    </button>
  </main>

  <footer>
    <div class="row">
      <span><span class="dot" id="dot"></span> <b id="conn">connecting…</b></span>
      <span>program: <b id="program">—</b></span>
      <label class="opt"><input type="checkbox" id="autoCreate" checked /> auto-create missing scenes</label>
      <button id="reconnect" style="font:inherit;font-size:12px;padding:3px 10px;cursor:pointer">reconnect</button>
    </div>
    <div id="log"></div>
  </footer>

  <script>
    /* ------------------------------------------------------------------ *
     *  Test harness for the two-camera screen.
     *
     *  The endpoint at 10.82.181.253:4455 turned out to be OBS Studio's
     *  built-in websocket (obs-websocket 5.x), not a raw camera stream, so:
     *    - the password is used for the v5 challenge/salt SHA-256 handshake
     *    - "Camera A" / "Camera B" switch the OBS *program scene*
     *
     *  The Flutter version will do exactly this through the
     *  web_socket_channel package; this page is the throwaway equivalent.
     * ------------------------------------------------------------------ */

    const OBS = { host: '10.82.181.253', port: 4455, password: 'C8RsC84pViTVESA5' };
    const URL = `ws://${OBS.host}:${OBS.port}/`;

    /* ---------- SHA-256 (pure JS, so it works outside a secure context) ---------- */
    const K = new Uint32Array([
      0x428a2f98,0x71374491,0xb5c0fbcf,0xe9b5dba5,0x3956c25b,0x59f111f1,0x923f82a4,0xab1c5ed5,
      0xd807aa98,0x12835b01,0x243185be,0x550c7dc3,0x72be5d74,0x80deb1fe,0x9bdc06a7,0xc19bf174,
      0xe49b69c1,0xefbe4786,0x0fc19dc6,0x240ca1cc,0x2de92c6f,0x4a7484aa,0x5cb0a9dc,0x76f988da,
      0x983e5152,0xa831c66d,0xb00327c8,0xbf597fc7,0xc6e00bf3,0xd5a79147,0x06ca6351,0x14292967,
      0x27b70a85,0x2e1b2138,0x4d2c6dfc,0x53380d13,0x650a7354,0x766a0abb,0x81c2c92e,0x92722c85,
      0xa2bfe8a1,0xa81a664b,0xc24b8b70,0xc76c51a3,0xd192e819,0xd6990624,0xf40e3585,0x106aa070,
      0x19a4c116,0x1e376c08,0x2748774c,0x34b0bcb5,0x391c0cb3,0x4ed8aa4a,0x5b9cca4f,0x682e6ff3,
      0x748f82ee,0x78a5636f,0x84c87814,0x8cc70208,0x90befffa,0xa4506ceb,0xbef9a3f7,0xc67178f2]);
    function sha256Bytes(str) {
      const msg = new TextEncoder().encode(str);
      const bitLen = msg.length * 8;
      const withPad = new Uint8Array((((msg.length + 8) >> 6) + 1) << 6);
      withPad.set(msg);
      withPad[msg.length] = 0x80;
      const dv = new DataView(withPad.buffer);
      dv.setUint32(withPad.length - 4, bitLen >>> 0);
      dv.setUint32(withPad.length - 8, Math.floor(bitLen / 4294967296));
      const H = new Uint32Array([0x6a09e667,0xbb67ae85,0x3c6ef372,0xa54ff53a,0x510e527f,0x9b05688c,0x1f83d9ab,0x5be0cd19]);
      const w = new Uint32Array(64);
      const rotr = (x, n) => (x >>> n) | (x << (32 - n));
      for (let i = 0; i < withPad.length; i += 64) {
        for (let t = 0; t < 16; t++) w[t] = dv.getUint32(i + t * 4);
        for (let t = 16; t < 64; t++) {
          const s0 = rotr(w[t-15],7) ^ rotr(w[t-15],18) ^ (w[t-15] >>> 3);
          const s1 = rotr(w[t-2],17) ^ rotr(w[t-2],19) ^ (w[t-2] >>> 10);
          w[t] = (w[t-16] + s0 + w[t-7] + s1) >>> 0;
        }
        let [a,b,c,d,e,f,g,h] = H;
        for (let t = 0; t < 64; t++) {
          const S1 = rotr(e,6) ^ rotr(e,11) ^ rotr(e,25);
          const ch = (e & f) ^ (~e & g);
          const t1 = (h + S1 + ch + K[t] + w[t]) >>> 0;
          const S0 = rotr(a,2) ^ rotr(a,13) ^ rotr(a,22);
          const maj = (a & b) ^ (a & c) ^ (b & c);
          const t2 = (S0 + maj) >>> 0;
          h = g; g = f; f = e; e = (d + t1) >>> 0;
          d = c; c = b; b = a; a = (t1 + t2) >>> 0;
        }
        H[0]=(H[0]+a)>>>0; H[1]=(H[1]+b)>>>0; H[2]=(H[2]+c)>>>0; H[3]=(H[3]+d)>>>0;
        H[4]=(H[4]+e)>>>0; H[5]=(H[5]+f)>>>0; H[6]=(H[6]+g)>>>0; H[7]=(H[7]+h)>>>0;
      }
      // H holds uint32 words; write them big-endian so the digest bytes are in
      // the standard order (reading H.buffer directly would byte-reverse them).
      const out = new Uint8Array(32);
      const odv = new DataView(out.buffer);
      for (let i = 0; i < 8; i++) odv.setUint32(i * 4, H[i]);
      return out;
    }
    const b64bytes = (bytes) => btoa(String.fromCharCode(...bytes));
    const sha256b64 = (s) => b64bytes(sha256Bytes(s));
    // obs-websocket v5: base64(sha256(base64(sha256(password+salt)) + challenge))
    const obsAuth = (password, salt, challenge) => sha256b64(sha256b64(password + salt) + challenge);

    /* ---------------------------------- UI ---------------------------------- */
    const $ = (id) => document.getElementById(id);
    const logEl = $('log');
    const log = (msg) => {
      const t = new Date().toISOString().slice(11, 23);
      logEl.textContent += `${t}  ${msg}\n`;
      logEl.scrollTop = logEl.scrollHeight;
    };
    const setConn = (text, live) => { $('conn').textContent = text; $('dot').dataset.live = live ? '1' : '0'; };

    /* ----------------------------- OBS connection ---------------------------- */
    let ws = null;
    let identified = false;
    let scenes = [];            // [{index, name, uuid}]
    let programScene = null;
    let pending = new Map();    // requestId -> {resolve, reject, type}
    let reqSeq = 0;
    let retryTimer = null;

    const send = (op, d) => ws && ws.readyState === WebSocket.OPEN && ws.send(JSON.stringify({ op, d }));

    const request = (requestType, requestData) =>
      new Promise((resolve, reject) => {
        const requestId = `r${++reqSeq}`;
        pending.set(requestId, { resolve, reject, requestType });
        send(6, { requestType, requestId, ...(requestData ? { requestData } : {}) });
      });

    function connect() {
      clearTimeout(retryTimer);
      if (ws) { try { ws.close(); } catch {} ws = null; }
      identified = false;
      scenes = []; programScene = null; pending.clear();
      setConn(`connecting to ${URL}`, false);
      setButtonsEnabled(false);
      log(`connecting ${URL}`);
      try {
        ws = new WebSocket(URL);
      } catch (err) {
        setConn('invalid url', false);
        log('constructor error: ' + err.message);
        return;
      }

      ws.onmessage = async (e) => {
        let msg;
        try { msg = JSON.parse(e.data); } catch { return log('non-JSON frame: ' + String(e.data).slice(0, 120)); }

        if (msg.op === 0) {                       // Hello
          const { authentication: a, obsWebSocketVersion, obsStudioVersion } = msg.d;
          log(`OBS ${obsStudioVersion} / obs-websocket ${obsWebSocketVersion}`);
          const d = { rpcVersion: 1 };
          if (a) d.authentication = obsAuth(OBS.password, a.salt, a.challenge);
          send(1, d);
          return;
        }
        if (msg.op === 2) {                       // Identified
          identified = true;
          setConn('identified', true);
          log('identified — password accepted');
          await refresh();
          return;
        }
        if (msg.op === 5) return onEvent(msg.d);
        if (msg.op === 7) {                       // RequestResponse
          const { requestId, requestStatus, responseData } = msg.d;
          const p = pending.get(requestId);
          pending.delete(requestId);
          if (!p) return;
          requestStatus.result
            ? p.resolve(responseData)
            : p.reject(new Error(`${p.requestType}: ${requestStatus.comment || requestStatus.code}`));
          return;
        }
      };

      ws.onclose = (e) => {
        identified = false;
        setConn(`disconnected (${e.code}${e.reason ? ' ' + e.reason : ''})`, false);
        setButtonsEnabled(false);
        for (const p of pending.values()) p.reject(new Error('connection closed'));
        pending.clear();
        if (e.code !== 1000) {
          log(`closed ${e.code} ${e.reason || ''} — retrying in 3s`);
          retryTimer = setTimeout(connect, 3000);
        }
      };
      ws.onerror = () => log('socket error');
    }

    function onEvent(d) {
      if (d.eventType === 'CurrentProgramSceneChanged') {
        programScene = d.eventData.sceneName;
        log(`event: program -> ${programScene}`);
        render();
      } else {
        log(`event: ${d.eventType}`);
      }
    }

    async function refresh() {
      const list = await request('GetSceneList');
      // obs-websocket names these sceneName / sceneIndex / sceneUuid — normalise once here.
      scenes = (list.scenes || []).map((s) => ({ index: s.sceneIndex, name: s.sceneName, uuid: s.sceneUuid }));
      programScene = list.currentProgramSceneName;
      recomputeTargets();
      log(`scenes: ${scenes.length ? scenes.map((s) => s.name).join(', ') : '(none)'}`);
      setButtonsEnabled(true);
      render();
    }

    /* -------------------------------- cameras -------------------------------- */
    // Camera A -> first camera, Camera B -> second. Prefer scenes literally named
    // "Camera A"/"Camera B"; fall back to scene order; optionally create them.
    const slotSceneName = (cam) => `Camera ${cam}`;

    const stateByCam = { A: 'idle', B: 'idle' };
    const messageByCam = { A: '', B: '' };

    // Mapping rule (deliberately simple + deterministic, so the two buttons can
    // never both claim the same scene):
    //   - if OBS has scenes literally named "Camera A" / "Camera B", use those
    //   - otherwise fall back to scene order: first scene -> A, second -> B
    let targets = { A: null, B: null };
    let fallbackLogged = false;

    function recomputeTargets() {
      const exact = { A: null, B: null };
      for (const cam of ['A', 'B']) {
        const wanted = slotSceneName(cam).toLowerCase();
        exact[cam] = scenes.find((s) => s.name.toLowerCase() === wanted) || null;
      }
      if (exact.A || exact.B) {
        targets = exact;
        return;
      }
      targets = { A: scenes[0] || null, B: scenes[1] || null };
      if (!fallbackLogged && scenes.length) {
        fallbackLogged = true;
        log('no "Camera A"/"Camera B" scenes — buttons will use scene order instead');
      }
    }

    const resolveScene = (cam) => targets[cam];

    async function activate(cam) {
      if (!identified) return;
      const wanted = slotSceneName(cam);
      let target = resolveScene(cam);

      if (!target) {
        if (!$('autoCreate').checked) {
          messageByCam[cam] = `no "${wanted}" scene in OBS`;
          log(`[${cam}] no scene to switch to — create "${wanted}" in OBS, or enable auto-create`);
          return;
        }
        log(`[${cam}] creating scene "${wanted}"`);
        await request('CreateScene', { sceneName: wanted });
        await refresh();
        target = resolveScene(cam);
      }

      if (programScene === target.name) return;   // already live on this camera

      stateByCam[cam] = 'busy';
      messageByCam[cam] = `switching to ${target.name}…`;
      render();
      try {
        await request('SetCurrentProgramScene', { sceneName: target.name });
        programScene = target.name;
        log(`[${cam}] program scene -> ${target.name}`);
      } catch (err) {
        stateByCam[cam] = 'error';
        messageByCam[cam] = 'switch failed';
        log(`[${cam}] ${err.message}`);
      } finally {
        render();
      }
    }

    function render() {
      for (const cam of ['A', 'B']) {
        const btn = $('cam' + cam);
        const sub = $('sub' + cam);
        const target = resolveScene(cam);
        const isLive = target && programScene === target.name;
        btn.disabled = !identified;
        btn.dataset.state = isLive ? 'active' : stateByCam[cam] === 'busy' ? 'busy' : stateByCam[cam] === 'error' ? 'error' : 'idle';
        if (isLive) {
          sub.textContent = 'LIVE in OBS — program scene';
          stateByCam[cam] = 'idle';
          messageByCam[cam] = '';
        } else {
          sub.textContent = !identified
            ? 'connecting to OBS…'
            : messageByCam[cam] || (target ? `tap to switch OBS to "${target.name}"` : `create "${slotSceneName(cam)}" in OBS`);
        }
      }
      $('program').textContent = programScene || '—';
    }

    const setButtonsEnabled = (on) => { $('camA').disabled = !on; $('camB').disabled = !on; };

    $('camA').addEventListener('click', () => activate('A'));
    $('camB').addEventListener('click', () => activate('B'));
    $('reconnect').addEventListener('click', connect);
    $('autoCreate').addEventListener('change', render);

    log(`OBS endpoint ${URL}`);
    if (location.protocol === 'https:' && URL.startsWith('ws:')) {
      log('WARNING: page is https but OBS is ws:// — the browser will block this as mixed content');
    }
    connect();
  </script>
</body>
</html>
